<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unlock All Free Fire</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#08000f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:#12001f;
    border:1px solid #8b00ff;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 0 30px #6200ff55;
}

.logo{
    width:100%;
    max-width:380px;
    border-radius:15px;
    margin-bottom:20px;
}

h1{
    font-size:32px;
    color:#b000ff;
    text-shadow:0 0 15px #9d00ff;
}

h2{
    margin-top:5px;
    font-size:20px;
}

.descricao{
    color:#bbb;
    margin:18px 0;
    line-height:1.5;
}

.recursos{
    text-align:left;
    background:#1b002c;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.recursos p{
    margin:10px 0;
}

.botao{
    display:block;
    width:100%;
    padding:16px;
    background:linear-gradient(90deg,#7300ff,#b000ff);
    color:white;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
    border-radius:12px;
    box-shadow:0 0 20px #8c00ff66;
    transition:.2s;
}

.botao:hover{
    transform:scale(1.03);
}

.aviso{
    margin-top:20px;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <!-- COLOQUE SUA IMAGEM/CAPA AQUI -->
    <img src="capa.png" class="logo" alt="Unlock All Free Fire">

    <h1>UNLOCK ALL</h1>
    <h2>FREE FIRE</h2>

    <p class="descricao">
        Baixe o aplicativo através do botão abaixo.
    </p>

    <div class="recursos">
        <p>🔥 Unlock All</p>
        <p>🎮 Interface simples</p>
        <p>⚡ Aplicativo atualizado</p>
        <p>📱 Compatível com Android</p>
    </div>

    <!-- TROQUE SEU_LINK_AQUI PELO LINK DO SEU APK -->
    <a href="SEU_LINK_AQUI" class="botao">
        ⬇️ BAIXAR APLICATIVO
    </a>

    <p class="aviso">
        Verifique a origem do aplicativo antes de instalar.
    </p>

</div>

</body>
</html>
